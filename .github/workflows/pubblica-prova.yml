# Pubblicazione automatica nell'area di prova: impiantidisicurezza.it/nuovo/
# A ogni modifica sul ramo main il sito viene compilato e caricato via FTPS.
# Credenziali nei Secrets del repository: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
# L'utente FTP deve avere come cartella iniziale /httpdocs/nuovo (non può toccare il sito vero).
name: Pubblica area di prova

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pubblica-prova
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compila l'area di prova (/nuovo/, non indicizzabile)
        run: npm run build:prova

      - name: Carica su United Host via FTPS
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./

      - name: Avviso credenziali mancanti
        if: env.FTP_SERVER == ''
        run: echo "::warning::Secrets FTP non ancora impostati: il sito è stato compilato ma non caricato."
