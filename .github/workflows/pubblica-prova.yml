# Pubblicazione automatica nell'area di prova: impiantidisicurezza.it/nuovo/
# A ogni modifica sul ramo main il sito viene compilato e caricato via FTPS.
# Credenziali nei Secrets del repository: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
# L'utente FTP deve avere come cartella iniziale /httpdocs/nuovo (non può toccare il sito vero).
name: Pubblica area di prova

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pubblica-prova
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compila l'area di prova (/nuovo/, non indicizzabile)
        run: |
          npm run build:prova
          # pagina "in preparazione" per gli indirizzi non ancora esistenti
          printf 'ErrorDocument 404 /nuovo/404.html\n' > dist/.htaccess

      - name: Carica su United Host via FTPS (lftp)
        if: env.FTP_SERVER != ''
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          # la password passa da una variabile d'ambiente: non compare nella riga di comando né nei registri
          export LFTP_PASSWORD="$FTP_PASSWORD"
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set ssl:check-hostname no;
            set ftp:passive-mode true;
            set net:timeout 20;
            set net:max-retries 2;
            set net:reconnect-interval-base 5;
            open --env-password --user \"$FTP_USERNAME\" ftp://$FTP_SERVER;
            mirror --reverse --delete --verbose --parallel=2 dist/ ./
          "

      - name: Avviso credenziali mancanti
        if: env.FTP_SERVER == ''
        run: 'echo "::warning::Secrets FTP non ancora impostati, il sito è stato compilato ma non caricato."'
